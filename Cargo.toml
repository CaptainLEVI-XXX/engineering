[package]
name = "engineering-challenge"
version = "0.1.0"
edition = "2024"
build = "src/util/build.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossbeam = "0.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Operator config file; already locked as a build dependency (SBE schema).
serde_yaml_ng = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net", "io-util"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "=0.3.32", features = ["sink"] }
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# Release stays unchanged: enabling debug info measurably changed the generated
# code (__text +0.25% on aarch64-apple-darwin), so profiling uses its own
# profile and its results need confirming against plain release. Optionally
# RUSTFLAGS="-C force-frame-pointers=yes" cargo build --profile profiling
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

[build-dependencies]
ergo-sbe = "=0.1.16"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.9"
